spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sqldb-ecom-gateway
    username: root
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  application:
    name: gateway-service
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: product
          uri: http://localhost:8082
          predicates:
            - Path=lp://PRODUCT-SERVICE/**
      discovery:
        locator:
          enabled: true

server:
  port: 80
  forward-headers-strategy: FRAMEWORK
eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka