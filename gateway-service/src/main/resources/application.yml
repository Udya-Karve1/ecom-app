spring:
  jpa:
    hibernate:
      ddl-auto: update
  application:
    name: gateway-service
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
server:
  port: 80
  forward-headers-strategy: FRAMEWORK
eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka


